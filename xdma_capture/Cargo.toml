[package]
name = "xdma_capture"
version = "0.1.0"
edition = "2021"
description = "POC: XDMA H2C/C2H memory mapped capture impl"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", default-features = false, features = ["fs", "uio"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "xdma_capture"
path = "src/main.rs"

[lib]
name = "xdma_capture"
path = "src/lib.rs"
